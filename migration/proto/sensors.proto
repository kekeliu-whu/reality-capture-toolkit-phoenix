syntax = "proto3";

package proto;

// raw sensor data
message LidarMsg {
  message Point {
    double timestamp = 1;
    float x = 2;          // m
    float y = 3;          // m
    float z = 4;          // m
    uint32 intensity = 5;
  }

  repeated Point points = 1;
}

message ImuMsg {
  double timestamp = 1;
  float ax = 2;         // m/s^2
  float ay = 3;         // m/s^2
  float az = 4;         // m/s^2
  float gx = 5;         // rad/s
  float gy = 6;         // rad/s
  float gz = 7;         // rad/s
}

message ImuMsgList {
  repeated ImuMsg imu_msgs = 1;
}

message EncoderMsg {
  double timestamp = 1;
  float rx = 2;
  float ry = 3;
  float rz = 4;
  float rw = 5;
}

message EncoderMsgList {
  repeated EncoderMsg encoder_msgs = 1;
}

message GpsMsg {
  double timestamp = 1;
  double latitude = 2; // degrees
  double longitude = 3; // degrees
  double altitude = 4; // meters
  double lat_std = 5; // latitude standard deviation (meters)
  double lon_std = 6; // longitude standard deviation (meters)
  double alt_std = 7; // altitude standard deviation (meters)
}

message GpsMsgList {
  repeated GpsMsg gps_msgs = 1;
}

// LIO result
message UndistoredLidarMsg {
  message Point {
    float x = 2;          // m
    float y = 3;          // m
    float z = 4;          // m
    uint32 intensity = 5;
  }

  double timestamp = 1;
  repeated Point points = 2;
}

message PoseMsg {
  double timestamp = 1;
  double tx = 2;
  double ty = 3;
  double tz = 4;
  double rx = 5;
  double ry = 6;
  double rz = 7;
  double rw = 8;
  double gx = 9;
  double gy = 10;
  double gz = 11;
}

message PoseMsgList {
  repeated PoseMsg pose_msgs = 1;
}

// configuration files
// WARNING: if you change the following message, please also change file in migration/proto/config
message PgoConfig {
  bool use_gravity_alignment = 15;           // disabled by default
  double odom_edge_translation_error = 1;   // meters
  double odom_edge_rotation_error = 2;      // degrees
  double loop_edge_translation_error = 3;   // meters
  double loop_edge_rotation_error = 4;      // degrees
  double gravity_align_rotation_error = 14; // degrees

  double submap_duration_secs = 5;            // submap duration in seconds
  double submap_downsample_resolution = 6;    // submap downsample resolution

  double gicp_transform_epsilon = 7;          // submap refine match threshold
  int32 gicp_max_iterations = 8;              // submap refine match max iterations
  double gicp_fitness_score_threshold = 9;    // submap refine match fitness score threshold

  double loop_closure_search_radius = 10;     // loop closure distance threshold
  double loop_closure_search_time_diff = 11;  // loop closure time threshold

  int32 outer_iteration_num = 12;             // PGO outer iteration times
  int32 inner_iteration_num = 13;             // PGO inner iteration times
}

message PgoLoopConstraintMetric {
  int32 from_submap_index = 1;
  int32 to_submap_index = 2;
  double score = 3;
  double time_diff_secs = 4;
  double prior_distance_m = 5;
  double translation_error_m = 6;
  double rotation_error_deg = 7;
  double gicp_fitness_score = 8;
}

message PgoMetrics {
  string schema_version = 1;
  int32 pose_count = 2;
  int32 submap_count = 3;
  double trajectory_start_timestamp = 4;
  double trajectory_end_timestamp = 5;
  double trajectory_duration_secs = 6;
  double path_length_3d_m = 7;
  double path_length_2d_m = 8;
  double start_end_distance_3d_m = 9;
  double start_end_distance_2d_m = 10;

  bool use_rtk = 20;
  int32 gnss_measurement_count = 21;
  int32 adjacent_constraint_count = 22;
  int32 gravity_constraint_count = 23;
  int32 gnss_constraint_count = 24;
  int32 loop_constraint_count = 25;
  int32 btc_frames_without_descriptors = 26;
  int32 btc_frames_without_candidate = 27;
  int32 btc_matches_rejected_by_time = 28;
  int32 btc_matches_rejected_by_gicp = 29;
  int32 btc_accepted_outside_radius = 30;

  double initial_cost = 40;
  double final_cost = 41;
  int32 solver_iterations = 42;
  string solver_summary = 43;
  string solver_brief_report = 44;

  repeated PgoLoopConstraintMetric loop_constraints = 50;
}
