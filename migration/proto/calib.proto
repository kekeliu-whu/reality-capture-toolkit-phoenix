syntax = "proto3";

package reality_capture.calibration;

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  // Unit quaternion in xyzw order.
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

// A spatial transform and clock offset from a source sensor to a target sensor.
// Spatial transforms follow target_from_source naming:
//   p_target = target_from_source * p_source
// Time offsets follow:
//   t_target = t_source + time_offset_seconds
message SpatiotemporalTransform {
  double time_offset_seconds = 1;
  // Translation in meters, expressed in the target frame.
  Vector3 translation = 2;
  Quaternion rotation = 3;
}

message OpenCvCameraModel {
  // Focal lengths and principal point coordinates, in pixels.
  double focal_length_x = 1;
  double focal_length_y = 2;
  double principal_point_x = 3;
  double principal_point_y = 4;
  double k1 = 5;
  double k2 = 6;
  double p1 = 7;
  double p2 = 8;
}

message OpenCvFisheyeCameraModel {
  // Focal lengths and principal point coordinates, in pixels.
  double focal_length_x = 1;
  double focal_length_y = 2;
  double principal_point_x = 3;
  double principal_point_y = 4;
  double k1 = 5;
  double k2 = 6;
  double k3 = 7;
  double k4 = 8;
}

message CameraCalibration {
  string name = 1;

  // Camera-to-IMU transform: p_imu = imu_from_camera * p_camera.
  SpatiotemporalTransform imu_from_camera = 2;

  oneof camera_model {
    OpenCvCameraModel opencv = 3;
    OpenCvFisheyeCameraModel opencv_fisheye = 4;
  }
}

message Matrix3 {
  // Exactly 9 elements in row-major order.
  repeated double row_major_values = 1;
}

message ImuTpmIcra2014Intrinsics {
  Matrix3 accelerometer_ta = 1;
  Matrix3 accelerometer_ka = 2;
  Vector3 accelerometer_bias = 3;

  Matrix3 gyroscope_tg = 4;
  Matrix3 gyroscope_kg = 5;
  Vector3 gyroscope_bias = 6;
}

message ImuIntrinsics {
  oneof model {
    ImuTpmIcra2014Intrinsics tpm_icra_2014 = 1;
  }
}

message SimpleLidarIntrinsics {
  double e = 1;
  repeated double s = 2;
}

message LidarIntrinsics {
  oneof model {
    SimpleLidarIntrinsics simple = 1;
  }
}

// Default configuration without an encoder.
message DirectLidarImuExtrinsics {
  SpatiotemporalTransform imu_from_lidar = 1;
}

// Motorized configuration whose LiDAR-to-IMU transform passes through the
// encoder frame.
message LidarEncoderImuExtrinsics {
  SpatiotemporalTransform encoder_from_lidar = 1;
  SpatiotemporalTransform imu_from_encoder = 2;
}

message SensorCalibration {
  oneof lidar_extrinsics {
    DirectLidarImuExtrinsics direct = 1;
    LidarEncoderImuExtrinsics via_encoder = 2;
  }

  LidarIntrinsics lidar_intrinsics = 3;
  ImuIntrinsics imu_intrinsics = 4;
  repeated CameraCalibration cameras = 5;
}
