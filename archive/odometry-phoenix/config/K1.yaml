ros:
  imu_topic: /imu
  encoder_topic: /null
  lidar_topic: /livox/lidar
  gnss_topic: /gnss_data

  offline_mode_start_frame_id: 0
  offline_mode_end_frame_id: 200000
  offline_mode_speed_ratio: 5               # multiply the publish rate by FACTOR

preprocess:
  range_min: 0.3
  range_max: 70
  body_mask_min: [ -0.5, -0.5, -0.2 ]
  body_mask_max: [ 0, 0.5, 0.6 ]
  sweep_duration: 0.1
  sweep_cut_auto: true

downsample:
  area_method: 1        #K1 use method 1, ellipsoid method
  init_pca_downsample_dis: 1.5
  base_downsample_dis: 0.2
  max_downsample_dis: 0.3
  ref_downsample_point_num: 4000

init_param:
  init_pos_std: 0.001
  init_vel_std: 0.001
  init_rot_std: 0.001
  init_acc_bias_std: 0.001
  init_gyro_bias_std: 0.00005

kf:
  window_size: 10
  reset_window_size: 10
  acc_std: 0.080
  gyr_std: 0.003
  acc_std_slope: 0.0065
  gyro_std_slope: 0.0009
  acc_bias_std: 0.0020
  gyr_bias_std: 0.0002
  max_iter: 5
  faster_model: true
  knn_search_slope: 0.003
  knn_search_min_dist: 0.1
  lidar_std_dev_limit: 9999
  use_gnss: false
  use_vio: false
  use_edge: false
  use_static: false

# temp
knn_min_points: 8
knn_max_points: 8
knn_distance_limit: 0.4

resolution: 0.1   # 0.2m
small_scale: 60   # 30 * 0.2 --> 6m
forget_range: 200             # Local map forget radis, important parameter and don't modify
forget_ts: 200                # Local map forget time, important parameter and don't modify

convergence_num: 200
enable_normal_filter: true    # 法向过滤
enable_forget: true          # 开启遗忘
replace_points_flag: 0        # 0: 保留旧点， 1：保留新店，2：新旧融合

test_data_path: '/home/youyuan/文档/K1.las'
