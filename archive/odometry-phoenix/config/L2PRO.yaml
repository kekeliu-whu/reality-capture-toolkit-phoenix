model: 0 # 0: normal, 1: online, 2: robust

ros:
  imu_topic: /imu
  encoder_topic: /lidar_to_platform
  lidar_topic: /hesai/pandar
  gnss_topic: /gnss_data
  offline_mode_start_frame_id: 0
  offline_mode_end_frame_id: 1000000
  offline_mode_speed_ratio: 5               # multiply the publish rate by FACTOR

preprocess:
  range_min: 0.3
  range_max: 300
  body_mask_min: [ -0.5, -0.4, -1.5 ]
  body_mask_max: [ 0.5, 0.8, 0.5 ]
  sweep_duration: 0.1
  sweep_cut_auto: true
  # Use the calibration time offset.  Set only from an independently measured
  # clock-rate error; the previous hard-coded -5.333 ppm was dataset-specific.
  imu_clock_drift_ppm: 0.0

downsample:
  area_method: 0             # L2 use method 0, cube_4_side method
  init_pca_downsample_dis: 1.5
  base_downsample_dis: 0.1
  max_downsample_dis: 9999
  ref_downsample_point_num: 4000

init_param:
  init_pos_std: 0.001
  init_vel_std: 0.001
  init_rot_std: 0.001
  init_acc_bias_std: 0.0003
  init_gyro_bias_std: 0.00003
  use_single_pcl: false
  enable_debug: false
  debug_path: "/tmp"
  dynamic_init_enabled: true
  dynamic_init_min_duration: 2.0
  dynamic_init_max_duration: 4.0
  dynamic_init_icp_voxel_size: 0.25
  dynamic_init_icp_max_correspondence: 1.5
  dynamic_init_icp_fitness_threshold: 0.35
  # Keep enough geometry for a constrained six-DoF initialization ICP.
  dynamic_init_min_registration_points: 100
  dynamic_init_min_registration_ratio: 0.6
  dynamic_init_max_acc_std: 0.35
  dynamic_init_max_gyr_std: 0.08
  dynamic_init_max_mean_gyr: 0.08
  dynamic_init_max_acc_norm_error: 0.75
  dynamic_init_robust_sample_ratio: 0.25

kf:
  window_size: 10
  reset_window_size: 10
  max_iter: 10
  acc_std: 0.014
  gyr_std: 0.0017
  acc_std_slope: 0.0065
  gyro_std_slope: 0.0009
  acc_bias_std: 0.0004
  gyr_bias_std: 0.0001
  faster_model: true
  knn_search_slope: 0.003
  knn_search_min_dist: 0.1
  lidar_std_dev_limit: 9999
  use_gnss: false
  use_vio: false
  use_edge: false
  use_static: false

debug:
  save_predict: false
  save_update: false
  save_xmap: false
  save_xmap_interval: 100
  save_ba_points: false
  debug_path: "/tmp"

# temp
xmap:
  knn_min_points: 6
  knn_max_points: 6
  knn_distance_limit: 0.4

  resolution: 0.1
  small_scale: 30             # 0.1 * 30 = 3m
  forget_range: 200
  forget_ts: 200

  enable_normal_filter: true
  enable_forget: true
  replace_points_flag: 0

  convergence_num: 100
  test_data_path: '/home/youyuan/文档/K1.las'
