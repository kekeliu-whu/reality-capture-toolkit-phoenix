[project]
name = "navvis-cleanroom-reconstruction"
version = "0.1.0"
description = "Clean-room NavVis autonomous SLAM and post-processing reconstruction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "opencv-python>=4.5",
    "Pillow>=9",
    "Brotli>=1",
    "rosbags>=0.10; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
